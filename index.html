<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>
  <style>
    /* Black / military aesthetic */
    :root{
      --bg:#070707;
      --panel:#0f0f0f;
      --accent:#8aa22b; /* olive green */
      --muted:#6b6b6b;
      --danger:#b33;
    }
    html,body{height:100%;margin:0;background:linear-gradient(180deg,#000 0%,#050505 100%);font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#ddd}
    .container{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.03);padding:28px;border-radius:10px;max-width:420px;width:100%;box-shadow:0 6px 30px rgba(0,0,0,0.7)}
    .header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
    .logo{width:46px;height:46px;border-radius:6px;background:linear-gradient(135deg,var(--accent),#1e1e1e);display:flex;align-items:center;justify-content:center;font-weight:700;color:#071}
    .title{font-size:18px;font-weight:700;letter-spacing:1px;color:#ddd}
    .addr{font-size:12px;color:var(--muted);}
    .balance{font-size:36px;font-weight:800;color:var(--accent);text-align:center;margin:18px 0}
    .controls{display:flex;gap:12px;justify-content:center}
    .btn{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:10px 16px;border-radius:8px;color:#ddd;cursor:pointer;font-weight:700}
    .btn.primary{background:linear-gradient(90deg,rgba(138,162,43,0.08),rgba(138,162,43,0.02));border:1px solid rgba(138,162,43,0.18);color:var(--accent)}
    .btn:disabled{opacity:0.5;cursor:not-allowed}
    .claim-btn{display:block;width:100%;padding:14px 18px;border-radius:10px;background:#000;border:2px solid rgba(138,162,43,0.14);color:var(--accent);font-weight:900;font-size:18px}
    .small{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
    .note{font-size:12px;color:var(--muted);margin-top:8px}
  </style>
</head>

<!-- SDK requested: place below <head> -->
<script src='//libtl.com/sdk.js' data-zone='11621109' data-sdk='show_11621109'></script>

<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="logo">F</div>
        <div>
          <div class="title"></div>
          <div class="addr" id="addr">Not connected</div>
        </div>
      </div>

      <div class="balance" id="balance">0 $FAL</div>

      <div class="controls">
        <button class="btn" id="connectBtn">Connect Wallet</button>
      </div>

      <div style="margin-top:18px">
        <button id="claimBtn" class="claim-btn">claim $FAL A</button>
        <div class="small">Rewards: 100 $FAL per ad. Cooldown: 30s.</div>
        <div class="note">Minimum withdrawal 10,000 $FAL (withdrawals handled on-chain).</div>
      </div>
    </div>
  </div>

  <!-- TonConnect SDK (UMD) -->
  <script src="https://unpkg.com/@tonconnect/sdk/dist/tonconnect.browser.umd.min.js"></script>

  <script>
    // Telegram WebApp ready if available
    try{ if(window.Telegram && Telegram.WebApp && Telegram.WebApp.ready) Telegram.WebApp.ready(); }catch(e){}

    // Basic local balance persistence (will be replaced by server-side ledger later)
    const BAL_KEY = 'fal_balance_v1';
    const LAST_CLAIM_KEY = 'fal_last_claim_v1';
    const REWARD_AMOUNT = 100; // 100 $FAL per claim (display units)
    const COOLDOWN_MS = 30000; // 30 seconds

    const balanceEl = document.getElementById('balance');
    const claimBtn = document.getElementById('claimBtn');
    const connectBtn = document.getElementById('connectBtn');
    const addrEl = document.getElementById('addr');

    function readBalance(){
      const b = parseFloat(localStorage.getItem(BAL_KEY) || '0');
      return b;
    }
    function writeBalance(v){
      localStorage.setItem(BAL_KEY, String(v));
      updateUI();
    }
    function readLastClaim(){
      const t = parseInt(localStorage.getItem(LAST_CLAIM_KEY) || '0');
      return t;
    }
    function writeLastClaim(ts){
      localStorage.setItem(LAST_CLAIM_KEY, String(ts));
    }

    function updateUI(){
      const b = readBalance();
      balanceEl.textContent = b + ' $FAL';
      const last = readLastClaim();
      const now = Date.now();
      const diff = now - last;
      if(diff < COOLDOWN_MS){
        startCooldown(COOLDOWN_MS - diff);
      } else {
        claimBtn.disabled = false;
        claimBtn.textContent = 'claim $FAL A';
      }
    }

    let cooldownTimer = null;
    function startCooldown(ms){
      claimBtn.disabled = true;
      clearInterval(cooldownTimer);
      let remaining = Math.ceil(ms/1000);
      claimBtn.textContent = 'Wait ' + remaining + 's';
      cooldownTimer = setInterval(()=>{
        remaining -= 1;
        if(remaining <= 0){
          clearInterval(cooldownTimer);
          claimBtn.disabled = false;
          claimBtn.textContent = 'claim $FAL A';
        } else {
          claimBtn.textContent = 'Wait ' + remaining + 's';
        }
      },1000);
    }

    // Ad integration using provided SDK: show_3457507()
    async function showAdAndReward(){
      // Preload attempt (non-blocking)
      try{
        if(typeof show_3457507 === 'function'){
          // optional preload
          show_3457507({ type: 'preload', ymid: 'claim-event' }).catch(()=>{});
        }
      }catch(e){}

      // Show the rewarded ad
      if(typeof show_3457507 === 'function'){
        try{
          await show_3457507({ ymid: 'claim-event' });
          // success: user watched ad
          const b = readBalance();
          writeBalance(b + REWARD_AMOUNT);
          writeLastClaim(Date.now());
          startCooldown(COOLDOWN_MS);
          console.log('User watched the ad');
        }catch(e){
          console.log('Ad failed or was skipped');
          // Keep button enabled so user can try again
        }
      } else {
        // SDK not loaded: fallback - still reward for now
        const b = readBalance();
        writeBalance(b + REWARD_AMOUNT);
        writeLastClaim(Date.now());
        startCooldown(COOLDOWN_MS);
      }
    }

    claimBtn.addEventListener('click', async ()=>{
      // show popup ad variant if desired
      try{
        if(typeof show_3457507 === 'function'){
          // attempt popup first (non-blocking fallback to rewarded)
          try{
            await show_3457507({ type: 'pop', ymid: 'claim-pop' });
            console.log('Popup attempt completed');
            // After popup, show rewarded ad
          }catch(e){
            console.log('Popup ad failed to open');
          }
        }
      }catch(e){}

      // Show rewarded ad and reward on completion
      await showAdAndReward();
    });

    // Simple TonConnect connect (minimal integration)
    let tonconnect = null;
    let connectedAccount = null;
    async function initTonConnect(){
      try{
        if(window.TonConnect){
          tonconnect = new TonConnect.TonConnect();
        } else if(window.TonConnectSDK){
          tonconnect = new TonConnectSDK.TonConnect();
        } else {
          // library not loaded; still allow UI to function
          tonconnect = null;
        }
      }catch(e){ tonconnect = null; }

      connectBtn.addEventListener('click', async ()=>{
        if(!tonconnect){
          alert('TonConnect SDK not available in this environment.');
          return;
        }
        try{
          const provider = await tonconnect.connect();
          // provider/account may vary by implementation
          // Try to read account address from known fields
          connectedAccount = (tonconnect.account && tonconnect.account.address) || (provider && provider.account) || null;
          if(!connectedAccount && provider && provider.wallet && provider.wallet.account){
            connectedAccount = provider.wallet.account;
          }
          if(connectedAccount){
            addrEl.textContent = connectedAccount;
            connectBtn.textContent = 'Disconnect';
            connectBtn.classList.add('primary');
          }
        }catch(e){
          console.error('Connect error',e);
        }
      });
    }

    // Initial UI update
    updateUI();
    initTonConnect();
  </script>
</body>
</html>
